<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Facial Verification Capture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: {
            zinc: { 850: '#202024', 900: '#18181b', 950: '#09090b' },
            brand: { light: '#FF7A3D', DEFAULT: '#FF4900', dark: '#CC3A00' }
          }
        }
      }
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .svg-mask-container { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .guide-ring { transition: stroke 0.5s ease, transform 0.5s ease, stroke-width 0.35s ease; transform-origin: center; }
    .guide-ring-blur { transition: opacity 0.5s ease, stroke 0.5s ease; }

    [data-state="neutral"] .guide-ring {
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 4px;
      stroke-dasharray: 18 14;
      animation: rotateDash 20s linear infinite;
    }
    [data-state="neutral"] .guide-ring-blur { opacity: 0; }

    [data-state="warning"] .guide-ring {
      stroke: #f59e0b;
      stroke-width: 6px;
      stroke-dasharray: 0;
      transform: scale(1.02);
    }
    [data-state="warning"] .guide-ring-blur { stroke: #f59e0b; opacity: 0.45; }

    [data-state="success"] .guide-ring {
      stroke: #10b981;
      stroke-width: 6px;
      stroke-dasharray: 0;
      transform: scale(0.985);
    }
    [data-state="success"] .guide-ring-blur { stroke: #10b981; opacity: 0.78; animation: pulseGlow 1.9s ease-in-out infinite; }

    [data-state="scanning"] .guide-ring {
      stroke: #FF4900;
      stroke-width: 5px;
      stroke-dasharray: 96 48;
      animation: rotateDashScanning 4s linear infinite;
    }
    [data-state="scanning"] .scan-line { display: block; animation: scanSweeper 2s ease-in-out infinite; }

    .capture-flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 50; }
    .capture-flash.active { animation: shutterFlash 0.8s ease forwards; }

    @keyframes rotateDash { to { stroke-dashoffset: -1000; } }
    @keyframes rotateDashScanning { to { stroke-dashoffset: 1000; } }
    @keyframes pulseGlow { 0%,100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 0.82; transform: scale(1.01); } }
    @keyframes scanSweeper { 0% { transform: translateY(-100%); opacity: 0; } 12% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(200%); opacity: 0; } }
    @keyframes shutterFlash { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

    .ui-text-slide-up { animation: slideUpFade 0.4s ease forwards; }
    .mask-overlay-layer { fill: rgba(9, 9, 11, 0.85); backdrop-filter: blur(8px); }
    @media (min-width: 641px) {
      body { background-color: #000; }
      .device-container {
        height: 850px;
        border-radius: 3rem;
        border: 8px solid #18181b;
        box-shadow: 0 25px 50px -12px rgba(255, 73, 0, 0.05), 0 0 0 1px rgba(255,255,255,0.05);
      }
    }
  </style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center p-0 sm:p-8 antialiased bg-zinc-950 font-sans text-zinc-50 overflow-hidden">
  <main id="capture-system" class="device-container relative w-full h-[100dvh] max-w-[420px] bg-black overflow-hidden flex flex-col mx-auto" data-state="neutral">
    <div class="absolute inset-0 z-0">
      <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80" alt="Camera user preview feed" class="w-full h-full object-cover opacity-80 filter contrast-125 brightness-75 scale-105 transition-transform duration-[10s] ease-linear" id="camera-feed">
      <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-transparent to-zinc-950/80"></div>
    </div>

    <svg class="svg-mask-container" viewBox="0 0 420 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="face-cutout">
          <rect width="100%" height="100%" fill="white" />
          <ellipse cx="50%" cy="45%" rx="135" ry="185" fill="black" />
        </mask>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      <rect width="100%" height="100%" class="mask-overlay-layer" mask="url(#face-cutout)" />
      <ellipse cx="50%" cy="45%" rx="135" ry="185" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="8" />
      <ellipse cx="50%" cy="45%" rx="135" ry="185" fill="none" class="guide-ring" />
      <ellipse cx="50%" cy="45%" rx="135" ry="185" fill="none" class="guide-ring-blur" stroke-width="12" filter="url(#glow)" />
      <foreignObject x="0" y="0" width="100%" height="100%" mask="url(#face-cutout)">
        <div class="absolute left-1/2 top-[45%] -translate-x-1/2 -translate-y-1/2 w-[270px] h-[370px] overflow-hidden rounded-[135px/185px]">
          <div class="scan-line hidden w-[200%] -left-[50%] h-[2px] bg-gradient-to-r from-transparent via-brand to-transparent shadow-[0_0_15px_3px_rgba(255,73,0,0.5)] absolute top-0"></div>
        </div>
      </foreignObject>
    </svg>

    <div class="relative z-20 flex flex-col h-full inset-0 px-6 py-12 justify-between">
      <div class="flex flex-col gap-6">
        <header class="flex items-center justify-between">
          <button class="w-10 h-10 rounded-full bg-zinc-900/50 backdrop-blur-md flex items-center justify-center border border-white/5 text-zinc-300"><i class="ph ph-x text-lg"></i></button>
          <div class="flex items-center gap-2"><i class="ph-fill ph-lock-key text-zinc-500 text-sm"></i><span class="text-xs font-semibold tracking-widest text-zinc-400 uppercase">Secure Capture</span></div>
          <button class="w-10 h-10 rounded-full flex items-center justify-center text-zinc-400"><i class="ph ph-question text-xl"></i></button>
        </header>

        <div class="bg-zinc-900/60 backdrop-blur-2xl border border-white/10 rounded-[1.5rem] p-5 shadow-glass text-center overflow-hidden min-h-[104px] flex flex-col justify-center">
          <div id="instruction-content" class="ui-text-slide-up flex flex-col gap-1">
            <h2 id="instruction-title" class="text-[22px] font-semibold tracking-tight text-white leading-tight">Position your face</h2>
            <p id="instruction-subtitle" class="text-sm text-zinc-400 font-medium">Ensure clearly lit and within the frame</p>
          </div>
        </div>
      </div>

      <div class="flex flex-col items-center gap-8 pb-4">
        <div class="relative flex items-center justify-center w-full">
          <button id="capture-button" class="group relative w-20 h-20 rounded-full bg-zinc-900/50 backdrop-blur-md border border-white/20 flex items-center justify-center transition-all duration-500">
            <div class="absolute inset-2 rounded-full border-2 border-transparent border-t-zinc-400"></div>
            <div id="btn-icon-container" class="relative z-10 text-white"><i id="btn-icon" class="ph-fill ph-camera text-2xl"></i></div>
          </button>
          <div id="capture-label" class="absolute -top-10 bg-black/60 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/5 flex items-center gap-2 opacity-0 transition-opacity duration-300 transform translate-y-2">
            <div class="w-2 h-2 rounded-full bg-brand animate-pulse"></div>
            <span class="text-xs font-semibold text-zinc-300 uppercase tracking-widest">Auto-Capturing</span>
          </div>
        </div>
        <div class="flex items-center gap-2 opacity-60"><i class="ph-fill ph-shield-check text-brand text-lg"></i><span class="text-xs font-medium text-zinc-400">Encrypted via OmniBank AES-256</span></div>
      </div>
    </div>
    <div class="capture-flash" id="flash-effect"></div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const system = document.getElementById('capture-system');
      const title = document.getElementById('instruction-title');
      const subtitle = document.getElementById('instruction-subtitle');
      const flashEffect = document.getElementById('flash-effect');
      const steps = [
        { state: 'neutral', title: 'Position your face', sub: 'Align your face within the frame.', duration: 1700 },
        { state: 'warning', title: 'Move slightly closer', sub: 'Your face is outside the ideal zone.', duration: 1600 },
        { state: 'success', title: 'Perfect alignment', sub: 'Face is fully in view.', duration: 2100 },
        { state: 'scanning', title: 'Hold still', sub: 'Running liveness checks...', duration: 2200 },
      ];

      let i = 0;
      setInterval(() => {
        const step = steps[i % steps.length];
        system.setAttribute('data-state', step.state);
        title.textContent = step.title;
        subtitle.textContent = step.sub;
        if (i % steps.length === steps.length - 1) {
          flashEffect.classList.add('active');
          setTimeout(() => flashEffect.classList.remove('active'), 800);
        }
        i += 1;
      }, 2200);
    });
  </script>
</body>
</html>
